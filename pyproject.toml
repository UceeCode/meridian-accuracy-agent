[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-agent"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "pandas>=2.0", "python-dotenv>=1.0"]

[project.scripts]
meridian-agent = "meridian_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
